name: dartpad_jaspr
description: A new Jaspr project
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  jaspr: ^0.23.1
  jaspr_router: ^0.8.2
  dartpad:
    path: third_party/dart-sdk/pkg/dartpad
  universal_web: ^1.1.1+1
  archive: ^4.0.9
  http: ^1.6.0
  yaml_edit: ^2.2.4
  yaml: ^3.1.3
  jaspr_riverpod: ^0.4.0
  riverpod: ">=3.2.0 <3.3.0" # riverpod 3.3.2 breaks jaspr_riverpod 0.4.5 (Vsync signature change)
dev_dependencies:
  build_runner: ^2.10.0
  build_web_compilers: ^4.8.0
  jaspr_builder: ^0.23.1
  jaspr_test: ^0.23.1
  lints: ^5.0.0
  test: ^1.31.1

dependency_overrides:
  web:

jaspr:
  mode: static
